; Límites de carga de archivos de PHP.
; Deben cubrir el mayor máximo que valida la aplicación (importación de la demo:
; 100 MB; biblioteca: 50 MB; documentos e imágenes: 10 MB). Cada formulario sigue
; validando su propio máximo y devuelve un mensaje claro; estos valores solo evitan
; que PHP rechace el archivo antes de llegar a Laravel ("Subir archivo ha fallado").
upload_max_filesize = 100M
post_max_size = 110M
max_file_uploads = 20
max_execution_time = 120
max_input_time = 120
